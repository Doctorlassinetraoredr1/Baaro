name: BAARO CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lock check
        run: npm run check:lock

      - name: Security audit scan
        run: npm run audit:security

      - name: API endpoint count (≤ 12)
        shell: bash
        run: |
          # Internal helpers (_*.js) are implementation files, not API endpoints.
          count=$(find api -maxdepth 1 -type f -name '*.js' ! -name '_*.js' | wc -l | tr -d ' ')
          echo "api endpoint files: $count"
          if [ "$count" -gt 12 ]; then
            echo "FAIL: api/ has $count endpoint JS files (max 12)"
            find api -maxdepth 1 -type f -name '*.js' ! -name '_*.js' | sort
            exit 1
          fi

      - name: Smoke
        run: node scripts/check-e2e-smoke.mjs

      - name: E2E readiness
        run: npm run check:e2e

      - name: Production checklist script
        run: npm run check:production

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder
          VITE_APP_ENV: ci
