    <!-- DEBUG TEMPORAIRE : capture et affiche les erreurs JS à l'écran -->
    <script>
      (function () {
        function showError(title, detail) {
          var box = document.getElementById('__debug_error_box');
          if (!box) {
            box = document.createElement('div');
            box.id = '__debug_error_box';
            box.style.cssText =
              'position:fixed;top:0;left:0;right:0;z-index:999999;background:#B00020;color:#fff;' +
              'font-family:monospace;font-size:13px;padding:12px;max-height:80vh;overflow:auto;' +
              'white-space:pre-wrap;word-break:break-word;';
            document.documentElement.appendChild(box);
          }
          var entry = document.createElement('div');
          entry.style.cssText = 'border-top:1px solid rgba(255,255,255,0.3);padding-top:8px;margin-top:8px;';
          entry.textContent = title + '\n' + detail;
          box.appendChild(entry);
        }
        window.onerror = function (message, source, lineno, colno, error) {
          showError(
            '❌ ERREUR JS',
            message + '\nFichier: ' + source + ':' + lineno + ':' + colno +
              (error && error.stack ? '\nStack: ' + error.stack : '')
          );
        };
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showError(
            '❌ PROMESSE REJETÉE',
            (reason && reason.message ? reason.message : String(reason)) +
              (reason && reason.stack ? '\nStack: ' + reason.stack : '')
          );
        });
      })();
    </script>
    <!-- FIN DEBUG TEMPORAIRE -->
